# ==================================================================
# DATABASE MIGRATION TOOL CONFIGURATION
# ==================================================================

[alembic]
# Path to migration scripts
script_location = %(here)s/alembic

# List of directories
prepend_sys_path = .

# Separator for path elements
path_separator = os

# Database URL
sqlalchemy.url = driver://user:pass@localhost/dbname

# Template used to generate migration files
[post_write_hooks]

# Hook format generated migration files with black
[loggers]
keys = root,sqlalchemy,alembic

# Handlers for loggers
[handlers]
keys = console

# Formatters for handlers
[formatters]
keys = generic

# Logger configuration
[logger_root]
level = WARNING
handlers = console
qualname =

# Logger for SQLAlchemy engine
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

# Logger for Alembic
[logger_alembic]
level = INFO
handlers =
qualname = alembic

# Handler configuration for console output
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

# Formatter configuration for generic log messages
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
