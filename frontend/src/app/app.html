<!-- ==================================================================
     FORGE (APPLICATION STRUCTURE)
     ================================================================== -->

<!-- HEADER -->
<div class="min-h-screen bg-forge-bg text-forge-text font-mono">
  @if (auth.isLoggedIn()) {
    <nav
      class="sticky top-0 z-40 border-b border-forge-border bg-forge-surface/90 backdrop-blur px-6 py-3 flex items-center justify-between"
    >
      <!-- NAVIGATION BAR -->
      <div class="flex items-center gap-2">
        <a
          routerLink="/dashboard"
          class="text-forge-primary font-black tracking-widest text-base uppercase hover:text-amber-400 transition-colors"
        >
          <span class="flex items-center gap-2">
            <ng-icon name="phosphorRobot" size="36" />
            THE FORGE
          </span>
        </a>
        <button
          class="text-forge-muted/60 hover:text-forge-primary transition-colors p-1 flex items-center"
          title="Operator Manual"
          (click)="tutorialOpen.set(true)"
        >
          <ng-icon name="phosphorQuestionBold" size="20" />
        </button>
      </div>
      <div class="flex items-center gap-6 text-xs uppercase tracking-wider">
        <a routerLink="/dashboard" routerLinkActive="text-forge-primary" class="forge-nav-link">Dashboard</a>
        <a routerLink="/missions" routerLinkActive="text-forge-primary" class="forge-nav-link">Missions</a>
        <a routerLink="/forge" routerLinkActive="text-forge-primary" class="forge-nav-link">Forge</a>
        <a
          routerLink="/prestige"
          routerLinkActive="text-forge-primary"
          class="forge-nav-link flex items-center gap-1.5"
        >
          Prestige
          @if (playerState.prestigeCount() > 0) {
            <span
              class="text-[9px] font-black px-1.5 py-0.5 rounded-sm bg-forge-primary/15 text-forge-primary tabular-nums leading-none"
            >
              {{ playerState.prestigeCount() }}
            </span>
          }
        </a>
        <a routerLink="/skill-tree" routerLinkActive="text-forge-primary" class="forge-nav-link">Perks</a>
        <button
          class="forge-nav-link cursor-pointer uppercase tracking-wider text-xs"
          (click)="uiState.profileOpen.set(true)"
        >
          Profile
        </button>
      </div>
    </nav>
  }
  <!-- MAIN CONTENT -->
  <router-outlet />
</div>

<app-toast />
<app-settings-panel
  [open]="uiState.settingsOpen()"
  (closed)="closeAll()"
/>
<app-profile-modal
  [open]="uiState.profileOpen()"
  (closed)="closeAll()"
  (settingsRequested)="uiState.settingsOpen.set(true)"
/>
<app-tutorial-modal [open]="tutorialOpen()" (closed)="tutorialOpen.set(false)" />
