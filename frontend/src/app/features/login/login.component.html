<!-- ==================================================================
     LOGIN COMPONENT TEMPLATE
     ================================================================== -->

<!-- HEADER -->
<div class="login-bg min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8 flex flex-col items-center">
      <ng-icon name="phosphorRobot" size="64" class="text-forge-primary mb-1" />
      <p class="text-6xl font-black text-forge-primary tracking-widest leading-none">THE</p>
      <p class="text-6xl font-black text-forge-primary tracking-widest leading-none mb-2">FORGE</p>
      <p class="text-special-rainbow text-xs tracking-[0.3em] uppercase font-bold">S.P.E.C.I.A.L. Edition</p>
    </div>

    <!-- LOGIN FORM -->
    <div class="forge-card p-6 shadow-forge">
      <h2 class="forge-section-title mb-5">Login</h2>

      <form (ngSubmit)="submit()" class="flex flex-col gap-4">
        <div>
          <label class="block text-xs text-forge-text/60 mb-1 uppercase tracking-widest">Email</label>
          <input
            class="forge-input"
            type="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
            placeholder="ghost@forge.io"
            required
            autocomplete="email"
          />
        </div>

        <div>
          <label class="block text-xs text-forge-text/60 mb-1 uppercase tracking-widest">Password</label>
          <input
            class="forge-input"
            type="password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />
        </div>

        @if (error()) {
          <p class="text-red-400 text-xs border border-red-500/30 rounded px-3 py-2 bg-red-500/5">
            {{ error() }}
          </p>
        }
        <!-- SUBMIT BUTTON-->
        <button class="forge-btn-primary forge-btn-action btn-shimmer w-full mt-1" type="submit" [disabled]="loading()">
          @if (loading()) {
            FORGING ACCESS...
          } @else {
            SIGN IN
          }
        </button>
      </form>
    </div>
    <!-- REGISTER INSTRUCTION -->
    <p class="text-center text-forge-text/50 text-[10px] mt-4 uppercase tracking-widest">
      No account yet?
      <a routerLink="/register" class="text-forge-primary hover:text-amber-400 transition-colors">Register</a>
    </p>
  </div>
</div>
