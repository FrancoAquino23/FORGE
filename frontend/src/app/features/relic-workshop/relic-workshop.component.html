<!-- ==================================================================
     RELIC WORKSHOP COMPONENT TEMPLATE
     ================================================================== -->

<div class="forge-card p-5">
  <div class="mb-4 flex items-center justify-between">
    <h3 class="forge-section-title">Relic Workshop</h3>
    <button
      class="text-[9px] font-bold uppercase tracking-widest border px-2 py-1 rounded-sm transition-colors"
      [class]="previewLabel() ? 'text-forge-text border-forge-border/60' : 'text-forge-muted/50 hover:text-forge-muted border-forge-border/20 hover:border-forge-border/50'"
      (click)="cyclePreviewLevel()"
    >★ {{ previewLabel() ?? 'preview' }}</button>
  </div>

  @if (!loading() || relics().length) {
    <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
      @for (r of displayRelics(); track r.attribute_code) {
        <div
          class="relic-card bg-forge-surface border rounded-sm p-3 flex flex-col gap-2.5 transition-colors"
          [class]="relicBorderClass(r)"
          [style]="relicCardStyle(r)"
        >
          <!-- HEADER -->
          <div class="flex flex-col items-center gap-1 pt-1">
            <ng-icon [name]="relicIcon(r.attribute_code)" size="20" [class]="attrColor(r.attribute_code)" />
            <span
              class="text-[9px] font-black tracking-wider text-center leading-tight"
              [class]="attrColor(r.attribute_code)"
            >
              {{ relicName(r.attribute_code) }}
            </span>
          </div>

          <!-- LEVEL BADGE -->
          <div class="flex items-center justify-between">
            <span class="text-[9px] text-forge-text/70 uppercase tracking-widest">Level</span>
            <span class="text-sm font-black leading-none tabular-nums" [class]="attrColor(r.attribute_code)">
              {{ formatLevel(r.level) }}
            </span>
          </div>

          <!-- BONUS -->
          <div class="text-center py-0.5">
            <span class="font-black text-sm leading-none tabular-nums" [class]="attrColor(r.attribute_code)">
              +{{ r.bonus_pct }}%
            </span>
            <p class="text-[9px] text-forge-text/70 uppercase tracking-widest mt-0.5">Active Bonus</p>
          </div>

          <!-- UPGRADE BUTTON -->
          @if (r.level >= 10) {
            <button
              class="relic-upgrade-btn forge-btn-primary forge-btn-action text-[9px] w-full py-1.5 btn-action-locked"
              disabled
            >
              MAX
            </button>
          } @else {
            <button
              class="relic-upgrade-btn forge-btn-primary forge-btn-action text-[9px] w-full py-1.5"
              [class.btn-action-ready]="r.can_upgrade && upgrading() !== r.attribute_code"
              [class.btn-action-locked]="upgrading() === r.attribute_code"
              [disabled]="!r.can_upgrade || upgrading() === r.attribute_code"
              (click)="upgrade(r)"
            >
              @if (upgrading() === r.attribute_code) {
                Forging...
              } @else {
                FORGE UPGRADE
                <span class="block text-[9px] font-black tabular-nums opacity-70 mt-0.5">
                  {{ fmt(r.upgrade_cost ?? 0) }} {{ r.is_luck ? 'STR' : 'mat' }}
                </span>
              }
            </button>
          }
        </div>
      }
    </div>
  }
</div>
