<!-- ==================================================================
     REGISTER COMPONENT TEMPLATE
     ================================================================== -->

<!-- HEADER -->
<div class="login-bg min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-5xl font-black text-forge-primary tracking-widest mb-1">THE FORGE</h1>
      <p class="text-special-rainbow text-xs tracking-[0.3em] uppercase font-bold">S.P.E.C.I.A.L. Edition</p>
    </div>

    <!-- REGISTER FORM -->
    <div class="forge-card p-6 shadow-forge">
      <h2 class="text-forge-text font-bold text-sm uppercase tracking-widest mb-5">Create Account</h2>

      <form (ngSubmit)="submit()" class="flex flex-col gap-4">
        <div>
          <label class="block text-xs text-forge-muted mb-1 uppercase tracking-wider">Username</label>
          <input
            class="forge-input"
            type="text"
            [(ngModel)]="username"
            name="username"
            placeholder="warrior_forge"
            required
            minlength="3"
            maxlength="50"
            autocomplete="username"
          />
        </div>

        <div>
          <label class="block text-xs text-forge-muted mb-1 uppercase tracking-wider">Email</label>
          <input
            class="forge-input"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="warrior@forge.io"
            required
            autocomplete="email"
          />
        </div>

        <div>
          <label class="block text-xs text-forge-muted mb-1 uppercase tracking-wider">Password</label>
          <input
            class="forge-input"
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="•••••••• (min. 8 characters)"
            required
            minlength="8"
            autocomplete="new-password"
          />
        </div>

        @if (error()) {
          <p class="text-red-400 text-xs border border-red-500/30 rounded px-3 py-2 bg-red-500/5">
            {{ error() }}
          </p>
        }
        <!-- SUBMIT BUTTON -->
        <button class="forge-btn-primary btn-shimmer w-full mt-1" type="submit" [disabled]="loading()">
          @if (loading()) {
            Forging your legend...
          } @else {
            Create Account
          }
        </button>
      </form>
    </div>
    <!-- LOGIN INSTRUCTION -->
    <p class="text-center text-forge-muted text-xs mt-4">
      Already have an account?
      <a routerLink="/login" class="text-forge-primary hover:text-amber-400 transition-colors">Sign in</a>
    </p>
  </div>
</div>
