<!-- ==================================================================
     TUTORIAL COMPONENT TEMPLATE
     ================================================================== -->

@if (open) {
  <!-- OVERLAY -->
  <div
    class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4"
    (click)="close()"
  ></div>

  <!-- PANEL -->
  <div
    class="fixed z-50 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-4xl bg-forge-surface border border-forge-border rounded-xl shadow-2xl flex flex-col max-h-[90vh]"
  >
    <!-- HEADER -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-forge-border flex-shrink-0">
      <div class="flex items-center gap-2.5">
        <ng-icon name="phosphorQuestionBold" class="text-forge-primary text-lg" />
        <span class="forge-section-title">Operator Manual</span>
      </div>
      <button class="p-1.5 text-forge-muted/50 hover:text-red-400 transition-colors" (click)="close()">
        <ng-icon name="phosphorXCircleBold" size="20" />
      </button>
    </div>

    <!-- SUBTITLE -->
    <p class="px-6 pt-4 pb-2 text-xs text-forge-text/50 tracking-wide flex-shrink-0">
      Select a tutorial to begin. You can revisit any of these at any time.
    </p>

    <!-- CARDS GRID -->
    <div class="overflow-y-auto forge-scroll-thin px-6 pb-6 pt-2">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        @for (t of tutorials; track t.id) {
          @let locked = t.id === 'skill-tree' && prestigeCount() === 0;
          <button
            class="group forge-card p-4 flex items-start gap-3.5 text-left transition-all duration-200 w-full"
            [class.hover:border-forge-primary/40]="!locked"
            [class.hover:bg-forge-card/80]="!locked"
            [class.cursor-pointer]="!locked"
            [class.opacity-40]="locked"
            [class.cursor-not-allowed]="locked"
            [disabled]="locked"
            (click)="!locked && launch(t.id)"
          >
            <!-- ICON -->
            <div
              class="flex-shrink-0 w-9 h-9 rounded-lg bg-forge-primary/10 border border-forge-primary/20 flex items-center justify-center transition-all duration-200"
              [class.group-hover:bg-forge-primary/20]="!locked"
              [class.group-hover:border-forge-primary/40]="!locked"
            >
              <ng-icon [name]="t.icon" class="text-forge-primary text-base" />
            </div>

            <!-- TEXT -->
            <div class="flex flex-col gap-0.5 min-w-0">
              <span
                class="text-xs font-black uppercase tracking-widest text-forge-text transition-colors duration-200"
                [class.group-hover:text-forge-primary]="!locked"
              >
                {{ t.title }}
              </span>
              <span class="text-[11px] text-forge-text/60 leading-relaxed">
                {{ locked ? 'Complete your first Prestige to unlock.' : t.description }}
              </span>
            </div>
          </button>
        }
      </div>
    </div>
  </div>
}
