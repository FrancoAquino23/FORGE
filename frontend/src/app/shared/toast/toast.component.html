<!-- ==================================================================
     TOAST COMPONENT TEMPLATE
     ================================================================== -->

<!-- CONTAINER -->
<div class="fixed top-14 right-4 z-50 flex flex-col gap-2 w-96 pointer-events-none">
  @for (toast of svc.toasts(); track toast.id) {
    <div
      class="forge-card border p-4 flex gap-3 shadow-xl pointer-events-auto animate-drop-in"
      [class.items-center]="!toast.message"
      [class.items-start]="!!toast.message"
      [class]="borderClass(toast)"
    >
      @if (toast.ngIcon) {
        <ng-icon
          [name]="toast.ngIcon"
          size="22"
          class="shrink-0"
          [class]="iconColorClass(toast)"
          [class.text-special-rainbow]="toast.type === 'prestige'"
        ></ng-icon>
      } @else {
        <span class="text-2xl leading-none shrink-0">{{ toast.icon }}</span>
      }
      <div class="flex-1 min-w-0">
        <p class="font-bold text-xs uppercase tracking-widest" [class.text-special-rainbow]="toast.type === 'prestige'">
          {{ toast.title }}
        </p>
        @if (toast.message) {
          <p
            class="text-xs mt-0.5 leading-snug"
            [class.text-special-rainbow]="toast.type === 'prestige'"
            [class.text-forge-muted]="toast.type !== 'prestige'"
          >
            {{ toast.message }}
          </p>
        }
      </div>
      <!-- DISMISS BUTTON -->
      <button
        class="text-forge-muted hover:text-white text-lg leading-none shrink-0 cursor-pointer transition-colors"
        (click)="svc.dismiss(toast.id)"
      >
        <ng-icon name="phosphorXCircleBold" />
      </button>
    </div>
  }
</div>
