<!-- ==================================================================
     DATE PICKER TEMPLATE
     ================================================================== -->

<div class="relative">
  <!-- TRIGGER -->
  <div
    role="button"
    tabindex="0"
    class="forge-input flex items-center gap-2 cursor-pointer select-none"
    (click)="toggle()"
    (keydown.enter)="toggle()"
    (keydown.space)="$event.preventDefault(); toggle()"
  >
    <!-- CALENDAR -->
    <svg
      class="w-3.5 h-3.5 flex-shrink-0 text-forge-muted/60"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="3" y="4" width="18" height="18" rx="2" />
      <line x1="16" y1="2" x2="16" y2="6" />
      <line x1="8" y1="2" x2="8" y2="6" />
      <line x1="3" y1="10" x2="21" y2="10" />
    </svg>

    @if (value) {
      <span class="text-forge-text text-xs flex-1 tracking-wider">{{ displayValue }}</span>
      <span
        role="button"
        class="text-forge-muted/40 hover:text-forge-muted text-[10px] leading-none transition-colors px-0.5"
        (click)="clearDate($event)"
        aria-label="Clear date"
      >
        ✕
      </span>
    } @else {
      <span class="text-forge-muted/50 text-xs flex-1 tracking-wide">mm/dd/yyyy</span>
      <span class="text-forge-muted/40 text-[10px]">▾</span>
    }
  </div>
  @if (open()) {
    <div
      class="absolute z-50 mt-1 w-72 bg-forge-card border border-forge-border rounded-sm overflow-hidden"
      style="
        box-shadow:
          0 0 0 1px rgba(245, 158, 11, 0.08),
          0 0 28px rgba(245, 158, 11, 0.08),
          0 12px 32px rgba(0, 0, 0, 0.7);
      "
    >
      <!-- NAVIGATION -->
      <div class="flex items-center justify-between px-3 py-2.5 border-b border-forge-border/60">
        <button
          type="button"
          class="w-7 h-7 flex items-center justify-center text-forge-muted hover:text-forge-primary transition-colors rounded-sm hover:bg-white/5 text-lg leading-none"
          (click)="prevMonth()"
        >
          ‹
        </button>

        <span class="text-[10px] font-black tracking-[0.18em] uppercase text-forge-primary">
          {{ monthLabel() }}
        </span>

        <button
          type="button"
          class="w-7 h-7 flex items-center justify-center text-forge-muted hover:text-forge-primary transition-colors rounded-sm hover:bg-white/5 text-lg leading-none"
          (click)="nextMonth()"
        >
          ›
        </button>
      </div>

      <!-- WEEK -->
      <div class="grid grid-cols-7 px-2 pt-2.5 pb-1">
        @for (h of DAY_HEADERS; track h) {
          <div class="text-center text-[9px] font-bold tracking-wider text-forge-muted/35 py-0.5">
            {{ h }}
          </div>
        }
      </div>

      <!-- DAY -->
      <div class="grid grid-cols-7 px-2 pb-3 gap-y-0.5">
        @for (day of calendarDays(); track $index) {
          @if (day) {
            <button
              type="button"
              class="h-8 w-full flex items-center justify-center text-[11px] rounded-[2px] transition-colors"
              [class]="dayClass(day)"
              (click)="selectDay(day)"
            >
              {{ day.getDate() }}
            </button>
          } @else {
            <div class="h-8"></div>
          }
        }
      </div>
    </div>
  }
</div>
